<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>K69 — Meier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&amp;family=Karla:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1b2733}a:hover{color:#0f1821}
button{cursor:pointer}
.korn{position:absolute;inset:0;background-image:url(../assets/korn.svg);opacity:0.12;mix-blend-mode:multiply;pointer-events:none}
</style>
</helmet>
<div style="position: relative; width: 720px; height: 900px; box-sizing: border-box; background: radial-gradient(90% 75% at 28% 18%, #7b96b1 0%, #5f7d9b 52%, #48627e 100%); color: #1b2733; font-family: Karla, 'Helvetica Neue', sans-serif; overflow: hidden; padding: 48px 56px; display: flex; flex-direction: column; gap: 24px">
  <div aria-hidden="true" style="position: absolute; right: -30px; top: 20px; font-family: Anton, Impact, sans-serif; font-size: 250px; line-height: 1; color: #6d8aa6">MEIER</div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase">Duel · taberen drikker 3</div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #C4776B; border: 3px solid #1b2733; box-sizing: border-box; box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.3), inset 0 2px 3px rgba(255, 255, 255, 0.35), 0 2px 4px rgba(15, 24, 33, 0.35)"></span>
      <span style="font-family: Anton, Impact, sans-serif; font-size: 40px; text-transform: uppercase">Dig</span>
      <span style="font-family: Anton, Impact, sans-serif; font-size: 22px">MOD</span>
      <span style="font-family: Anton, Impact, sans-serif; font-size: 40px; text-transform: uppercase">Jeppe</span>
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #8FAF74; border: 3px solid #1b2733; box-sizing: border-box; box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.3), inset 0 2px 3px rgba(255, 255, 255, 0.35), 0 2px 4px rgba(15, 24, 33, 0.35)"></span>
    </div>
  </div>

  <div style="position: relative; background: #1b2733; color: #ced8e2; border-radius: 4px; padding: 16px 20px; display: flex; align-items: center; gap: 16px">
    <div style="flex-grow: 1"><div style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: #9fb1c3">MELDINGEN</div><div style="font-family: Anton, Impact, sans-serif; font-size: 30px; text-transform: uppercase">Jeppe siger 54</div></div>
    <span style="font-size: 13px; color: #bcc6d0; max-width: 200px">Tro på det og slå, eller løft.</span>
  </div>

  <div style="position: relative; flex-grow: 1; background: linear-gradient(180deg, #dce3ea 0%, #ced8e2 60%, #c6d1dc 100%); border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 2px 4px rgba(15, 24, 33, 0.18), 0 28px 60px rgba(15, 24, 33, 0.38)">
    <sc-if value="{{kigger}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px">
        <div style="display: flex; gap: 18px">
          <span style="width: 96px; height: 96px; border: 3px solid #1b2733; border-radius: 16px; background: #ffffff; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px; box-sizing: border-box; gap: 4px"><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i><i></i><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i><i></i><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i><i></i><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i></span>
          <span style="width: 96px; height: 96px; border: 3px solid #1b2733; border-radius: 16px; background: #ffffff; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 14px; box-sizing: border-box; gap: 4px"><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i><i></i><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i><i></i><i></i><i></i><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i><i></i><i style="width: 16px; height: 16px; border-radius: 50%; background: #1b2733"></i></span>
        </div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase">Kun du kan se det · 64</div>
      </div>
    </sc-if>
    <sc-if value="{{lukket}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="width: 150px; height: 130px; background: linear-gradient(90deg, #121c26 0%, #2a3c50 35%, #1b2733 100%); border-radius: 14px 14px 40px 40px; box-shadow: 0 18px 30px rgba(15, 24, 33, 0.4); display: flex; align-items: center; justify-content: center"><span style="width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #dce3ea, #bcc6d0); display: flex; align-items: center; justify-content: center"><img src="../assets/elefant.svg" alt="" style="width: 64px; height: 60px"></span></div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase">Bægeret er dit — ryst det</div>
      </div>
    </sc-if>
    <button onMouseDown="{{kig}}" onMouseUp="{{slip}}" onMouseLeave="{{slip}}" onTouchStart="{{kig}}" onTouchEnd="{{slip}}" style="height: 52px; padding: 0 24px; border: 2px solid #1b2733; border-radius: 999px; background: transparent; font-family: Karla, sans-serif; font-size: 14px; font-weight: 700; color: #1b2733">Hold fingeren for at kigge</button>
  </div>

  <div style="position: relative; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase">Meld — det samme eller højere</div>
    <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{meldinger}}" as="m" hint-placeholder-count="6">
        <button onClick="{{m.vaelg}}" style="{{m.stil}}">{{m.tal}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 58px; border: 0; border-radius: 3px; background: #1b2733; color: #ced8e2; font-family: Anton, Impact, sans-serif; font-size: 22px; letter-spacing: 0.05em; text-transform: uppercase">Meld {{valgt}}</button>
      <button style="height: 58px; border: 2px solid #1b2733; border-radius: 3px; background: #ced8e2; color: #1b2733; font-family: Anton, Impact, sans-serif; font-size: 22px; letter-spacing: 0.05em; text-transform: uppercase">Løft Jeppes bæger</button>
    </div>
  </div>
  <div class="korn" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { kig: false, valgt: '64' }; }
  renderVals() {
    const tal = ['54', '61', '62', '63', '64', '65', '11', '22', '33', 'Lille M', 'Meyer', '?'].slice(0, 6);
    const alle = ['61', '62', '63', '64', '65', '11'];
    return {
      kigger: this.state.kig, lukket: !this.state.kig,
      kig: () => this.setState({ kig: true }),
      slip: () => this.setState({ kig: false }),
      valgt: this.state.valgt,
      meldinger: alle.map((t) => ({
        tal: t,
        vaelg: () => this.setState({ valgt: t }),
        stil: 'height: 48px; border: 2px solid #1b2733; border-radius: 3px; font-family: Anton, Impact, sans-serif; font-size: 20px; ' + (this.state.valgt === t ? 'background: #1b2733; color: #ced8e2' : 'background: #bcc6d0; color: #1b2733')
      }))
    };
  }
}
</script>
</body>
</html>
