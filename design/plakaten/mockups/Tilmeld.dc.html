<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>K69 — kom med</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&amp;family=Karla:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1b2733}a:hover{color:#0f1821}
button{cursor:pointer}
.korn{position:absolute;inset:0;background-image:url(../assets/korn.svg);opacity:0.12;mix-blend-mode:multiply;pointer-events:none}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; background: radial-gradient(90% 75% at 28% 18%, #7b96b1 0%, #5f7d9b 52%, #48627e 100%); color: #1b2733; font-family: Karla, 'Helvetica Neue', sans-serif; overflow: hidden">

  <div aria-hidden="true" style="position: absolute; left: 40px; top: 90px; font-family: Anton, Impact, sans-serif; font-size: 300px; line-height: 0.9; color: #6d8aa6">K7M2Q</div>
  <img src="../assets/elefant.svg" alt="" style="position: absolute; left: 150px; bottom: -150px; width: 560px; height: 527px">

  <header style="position: absolute; left: 64px; top: 40px; display: flex; align-items: center; gap: 16px">
    <a href="Main.dc.html" style="font-family: Anton, Impact, sans-serif; font-size: 28px; letter-spacing: 0.04em">K69</a>
    <span style="padding: 8px 14px; border: 1.5px solid #1b2733; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.16em">SPIL K7M2Q</span>
  </header>

  <div style="position: absolute; left: 64px; top: 450px; width: 520px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 60px; line-height: 1; text-transform: uppercase">Mette, Jeppe og Sofie venter.</h1>
    <p style="margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; font-size: 23px; line-height: 1.4; color: #0f1821">Skriv et navn, vælg en brik og hvad du drikker — så er du med.</p>
  </div>

  <section style="position: absolute; right: 64px; top: 40px; bottom: 40px; width: 600px; box-sizing: border-box; background: linear-gradient(180deg, #dce3ea 0%, #ced8e2 60%, #c6d1dc 100%); border-radius: 12px; padding: 36px 40px; display: flex; flex-direction: column; gap: 26px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 2px 4px rgba(15, 24, 33, 0.18), 0 28px 60px rgba(15, 24, 33, 0.38)">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="navn" style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #3f566d">Dit navn</label>
      <input id="navn" type="text" maxlength="24" value="Rasmus" style="height: 54px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #5f7d9b; border-radius: 3px; background: #e6ecf1; color: #1b2733; font-family: Karla, sans-serif; font-size: 18px; font-weight: 600">
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #3f566d">Din brik</div>
      <div style="display: flex; gap: 12px">
        <sc-for list="{{brikker}}" as="b" hint-placeholder-count="8">
          <button aria-label="{{b.label}}" disabled="{{b.optaget}}" onClick="{{b.vaelg}}" style="{{b.stil}}"></button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #3f566d">Hvad drikker du?</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{drikke}}" as="d" hint-placeholder-count="4">
          <button onClick="{{d.vaelg}}" style="{{d.stil}}"><b style="display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 20px; letter-spacing: 0.03em; text-transform: uppercase">{{d.navn}}</b><span style="font-size: 12.5px">{{d.info}}</span></button>
        </sc-for>
      </div>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #33475b">En slurk er den samme mængde alkohol uanset hvad du drikker. Appen omregner tårnet til din egen drik.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #3f566d">Dame- og kongekort</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{hold}}" as="h" hint-placeholder-count="2">
          <button onClick="{{h.vaelg}}" style="{{h.stil}}"><b style="display: block; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 20px; letter-spacing: 0.03em; text-transform: uppercase">{{h.navn}}</b><span style="font-size: 12.5px">{{h.info}}</span></button>
        </sc-for>
      </div>
    </div>

    <div style="flex-grow: 1"></div>
    <a href="Lobby.dc.html" style="height: 60px; display: flex; align-items: center; justify-content: center; gap: 14px; border-radius: 3px; background: #1b2733; color: #ced8e2; font-family: Anton, Impact, sans-serif; font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase">
      <span style="{{valgtBrik}}"></span>
      Kom med i spillet
    </a>
  </section>
  <div class="korn" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { farve: '#C4776B', drik: 'ol', hold: 'herre' }; }
  renderVals() {
    const farver = ['#D8A93F', '#8FAF74', '#87A4C6', '#C4776B', '#B189A6', '#7FB0A4', '#E8C7A0', '#9C9A78'];
    const taget = ['#D8A93F', '#8FAF74', '#87A4C6'];
    const s = this.state;
    const kort = (on) => 'text-align: left; padding: 12px 14px; border-radius: 3px; font-family: Karla, sans-serif; color: ' + (on ? '#ced8e2' : '#1b2733') + '; background: ' + (on ? '#1b2733' : '#bcc6d0') + '; border: 1.5px solid ' + (on ? '#1b2733' : '#9fb1c3');
    return {
      brikker: farver.map((f) => {
        const optaget = taget.includes(f), on = s.farve === f;
        return {
          label: 'Brik i farven ' + f + (optaget ? ' (taget)' : ''), optaget,
          vaelg: () => this.setState({ farve: f }),
          stil: 'width: 48px; height: 48px; border-radius: 50%; background: ' + f + '; border: 3px solid ' + (on ? '#1b2733' : 'transparent') + '; box-shadow: ' + (on ? '0 0 0 3px #ced8e2, 0 0 0 5px #1b2733' : 'none') + '; opacity: ' + (optaget ? 0.25 : 1)
        };
      }),
      drikke: [
        { id: 'ol', navn: 'Pilsner', info: '4,6% · 33 cl · 11 slurke' },
        { id: 'vin', navn: 'Vin', info: '12% · 15 cl · 11 slurke' },
        { id: 'whisky', navn: 'Whisky', info: '40% · 4 cl · 11 slurke' },
        { id: 'egen', navn: 'Noget andet', info: 'Skriv selv navn, størrelse og procent' }
      ].map((d) => ({ ...d, vaelg: () => this.setState({ drik: d.id }), stil: kort(s.drik === d.id) })),
      hold: [
        { id: 'dame', navn: 'Damerne', info: 'Du drikker når en dame trækkes' },
        { id: 'herre', navn: 'Herrerne', info: 'Du drikker når en konge trækkes' }
      ].map((h) => ({ ...h, vaelg: () => this.setState({ hold: h.id }), stil: kort(s.hold === h.id) })),
      valgtBrik: 'width: 26px; height: 26px; border-radius: 50%; background: ' + s.farve + '; border: 2px solid #ced8e2'
    };
  }
}
</script>
</body>
</html>
