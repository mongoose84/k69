<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>K69 — mobil forside</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&amp;family=Karla:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1b2733}a:hover{color:#0f1821}
button{cursor:pointer}
.korn{position:absolute;inset:0;background-image:url(../assets/korn.svg);opacity:0.12;mix-blend-mode:multiply;pointer-events:none}
.fane{cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(90% 75% at 28% 18%, #7b96b1 0%, #5f7d9b 52%, #48627e 100%); color: #1b2733; font-family: Karla, 'Helvetica Neue', sans-serif; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 12px; top: 40px; font-family: Anton, Impact, sans-serif; font-size: 190px; line-height: 0.9; color: #6d8aa6">K69</div>
  <img src="../assets/elefant.svg" alt="Krunk-elefanten" style="position: absolute; right: -80px; top: 150px; width: 380px; height: 358px">

  <header style="position: absolute; left: 20px; right: 20px; top: 20px; display: flex; justify-content: space-between; align-items: center">
    <div style="font-family: Anton, Impact, sans-serif; font-size: 24px; letter-spacing: 0.04em">K69</div>
    <span style="padding: 6px 11px; border: 1.5px solid #1b2733; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: 0.14em">1–8 SPILLERE</span>
  </header>

  <div style="position: absolute; left: 20px; right: 20px; top: 430px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 42px; line-height: 1; text-transform: uppercase">Ét tårn.<br>En pit der gør ondt.</h1>
    <p style="margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; font-size: 19px; line-height: 1.4; color: #0f1821">Brættet fra Tinglev. Start et spil og del linket i gruppen.</p>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; box-sizing: border-box; background: linear-gradient(180deg, #dce3ea 0%, #ced8e2 60%, #c6d1dc 100%); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 2px 4px rgba(15, 24, 33, 0.18), 0 28px 60px rgba(15, 24, 33, 0.38)">
    <div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1.5px solid #bcc6d0">
      <button class="fane" role="tab" aria-selected="{{nyValgt}}" onClick="{{visNy}}" style="{{nyStil}}">Nyt spil</button>
      <button class="fane" role="tab" aria-selected="{{deltagValgt}}" onClick="{{visDeltag}}" style="{{deltagStil}}">Deltag med kode</button>
    </div>
    <sc-if value="{{nyValgt}}" hint-placeholder-val="{{ true }}">
      <a href="MobilBord.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #1b2733; color: #ced8e2; font-family: Anton, Impact, sans-serif; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase">Opret spil og få et link</a>
    </sc-if>
    <sc-if value="{{deltagValgt}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="kode-m" style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #3f566d">Spilkode</label>
        <input id="kode-m" type="text" maxlength="8" placeholder="FX K7M2Q" style="height: 56px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #5f7d9b; border-radius: 3px; background: #e6ecf1; color: #1b2733; font-family: Anton, Impact, sans-serif; font-size: 22px; letter-spacing: 0.3em; text-transform: uppercase">
        <a href="MobilBord.dc.html" style="height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #1b2733; color: #ced8e2; font-family: Anton, Impact, sans-serif; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase">Find spillet</a>
      </div>
    </sc-if>
  </div>
  <div class="korn" aria-hidden="true"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { fane: 'ny' }; }
  renderVals() {
    const paa = 'height: 44px; margin-bottom: -1.5px; padding: 0; border: 0; border-bottom: 3px solid #1b2733; background: transparent; color: #1b2733; font-family: Karla, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase';
    const af = 'height: 44px; margin-bottom: -1.5px; padding: 0; border: 0; border-bottom: 3px solid transparent; background: transparent; color: #4a6075; font-family: Karla, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase';
    const ny = this.state.fane === 'ny';
    return {
      nyValgt: ny, deltagValgt: !ny,
      nyStil: ny ? paa : af, deltagStil: ny ? af : paa,
      visNy: () => this.setState({ fane: 'ny' }),
      visDeltag: () => this.setState({ fane: 'deltag' })
    };
  }
}
</script>
</body>
</html>
