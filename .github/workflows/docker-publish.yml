# Bygger de tre images (api, web, mobil) og skubber dem til GitHub Container
# Registry ved push til main. kant og db er stock-images og bygges ikke.
#
# Images ender som:
#   ghcr.io/<ejer>/k69/api:latest     ghcr.io/<ejer>/k69/api:main-<sha>
#   ghcr.io/<ejer>/k69/web:latest     ...
#   ghcr.io/<ejer>/k69/mobil:latest   ...
#
# Valgfrit deploy-webhook: sæt secrets DEPLOY_WEBHOOK_URL og
# DEPLOY_WEBHOOK_SECRET, så kaldes hooket (HMAC-signeret) når alle tre er ude.
name: Byg og udgiv Docker-images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Tests og typer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck

  byg:
    name: Byg ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/api.Dockerfile
            build-args: ''
          - image: web
            dockerfile: docker/frontend.Dockerfile
            build-args: APP=web
          - image: mobil
            dockerfile: docker/frontend.Dockerfile
            build-args: APP=mobile

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sæt Docker Buildx op
        uses: docker/setup-buildx-action@v3

      - name: Log ind på GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Udled tags og labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Byg og skub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}:buildcache,mode=max

  affyr-spindkrog:
    name: Affyr Spindkrog
    needs: byg
    runs-on: ubuntu-latest

    steps:
      - name: affyr spindkrog
        env:
          SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          PAYLOAD='{"ref":"refs/heads/main"}'
          curl -X POST https://hook.kolbeck.xyz/hooks/krunk-k69 \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/.*= //')" \
            -d "$PAYLOAD"
  