# Tests og typetjek på hver pull request, så fejl fanges før de rammer main.
# Udgivelsen (docker-publish.yml) kører de samme trin igen efter merge.
name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests og typer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
