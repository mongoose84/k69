name: k69

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-k69}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k69}
      POSTGRES_DB: ${POSTGRES_DB:-k69}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-k69} -d ${POSTGRES_DB:-k69}']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-k69}:${POSTGRES_PASSWORD:-k69}@db:5432/${POSTGRES_DB:-k69}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP: web
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      - api

  mobil:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP: mobile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
    depends_on:
      - api

  kant:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:80'
    volumes:
      - ./docker/nginx-kant.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - mobil
      - api

volumes:
  db-data:
