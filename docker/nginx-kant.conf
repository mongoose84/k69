# Kanten. Ét domæne, to frontends: telefoner får mobil-appen, resten web.
# Vil man hellere have hvert sit domæne, peger man bare direkte på web/mobil.

map $http_user_agent $gaet {
  default           web;
  "~*android"       mobil;
  "~*iphone"        mobil;
  "~*ipod"          mobil;
  "~*windows phone" mobil;
  "~*blackberry"    mobil;
  "~*iemobile"      mobil;
  "~*opera mini"    mobil;
  "~*mobile safari" mobil;
}

# Valget gemmes i en cookie ved første besøg. Uden den ville /assets/... fra den
# ene app kunne blive hentet fra den anden ved næste kald, og så er der 404.
map $cookie_k69klient $fra_cookie {
  default '';
  web     web;
  mobil   mobil;
}

# ?klient=web eller ?klient=mobil slår både cookie og gæt.
map $arg_klient $valgt_nu {
  default $fra_cookie;
  web     web;
  mobil   mobil;
}

map $valgt_nu $valgt {
  default $valgt_nu;
  ''      $gaet;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  # Dockers egen DNS. Uden den slår nginx navnene op én gang ved opstart, og
  # så peger kanten på gamle containere efter en redeploy. Derfor slås de op
  # gennem en variabel, så opslaget sker pr. forespørgsel.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  set $api_op api;

  location /api/ {
    proxy_pass http://$api_op:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://$api_op:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    # Cookien sættes altid, så valget er det samme for html og assets.
    add_header Set-Cookie "k69klient=$valgt; Path=/; Max-Age=31536000; SameSite=Lax" always;
    proxy_pass http://$valgt:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
