server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  gzip_min_length 1024;

  # Byggede filer har hash i navnet og må gerne caches længe.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # /spil/KODE er en klientrute — index.html skal svare på den.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Dockers egen DNS, så api'ens adresse slås op pr. forespørgsel og ikke kun
  # ved opstart — ellers peger vi på en død container efter en redeploy.
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;
  set $api_op api;

  # Backenden ligger bag samme origin, så der er ingen CORS at holde styr på.
  location /api/ {
    proxy_pass http://$api_op:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ws {
    proxy_pass http://$api_op:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
